name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate portals/india.yml is valid YAML
        run: |
          node --input-type=module -e "import fs from 'fs'; import yaml from 'js-yaml'; yaml.load(fs.readFileSync('portals/india.yml', 'utf8')); console.log('portals/india.yml: valid YAML structure');"
      - name: Check required files exist
        run: |
          test -f CLAUDE.md && echo 'CLAUDE.md ok'
          test -f GEMINI.md && echo 'GEMINI.md ok'
          test -f package.json && echo 'package.json ok'
          test -f config/profile.example.yml && echo 'profile.example.yml ok'
          test -f scripts/scan.mjs && echo 'scan.mjs ok'
          test -f scripts/doctor.mjs && echo 'doctor.mjs ok'
          test -f scripts/generate-pdf.mjs && echo 'generate-pdf.mjs ok'
      - name: Verify scripts syntax
        run: |
          node --check scripts/scan.mjs && echo 'scan.mjs syntax ok'
          node --check scripts/doctor.mjs && echo 'doctor.mjs syntax ok'
          node --check scripts/daily-job-digest.mjs && echo 'daily-job-digest.mjs syntax ok'
          node --check scripts/watch-2027-sde.mjs && echo 'watch-2027-sde.mjs syntax ok'
